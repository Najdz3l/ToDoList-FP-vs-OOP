services:
  frontend:
    container_name: ToDo-List-Frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Hot Reload env variables
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/ToDoApp
      - /ToDoApp/node_modules
